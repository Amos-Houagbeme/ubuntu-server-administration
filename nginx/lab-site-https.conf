server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name 192.168.50.10;

    root /var/www/lab-site/public;
    index index.html index.htm;

    ssl_certificate /etc/ssl/certs/lab-site.crt;
    ssl_certificate_key /etc/ssl/private/lab-site.key;

    location / {
        try_files $uri $uri/ =404;
    }
}
